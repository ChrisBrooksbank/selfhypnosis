<!doctype html>
<meta charset="utf-8" />
<style>
    html,
    body {
        margin: 0;
        width: 1280px;
        height: 520px;
        overflow: hidden;
        background: #0d0a28;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        color: #fff;
    }
    .sky {
        position: absolute;
        inset: 0;
        background: radial-gradient(
            ellipse 60% 90% at 78% 55%,
            #5a46b8 0%,
            #2a2070 45%,
            #0d0a28 85%
        );
    }
    .stars {
        position: absolute;
        inset: 0;
    }
    .copy {
        position: absolute;
        left: 92px;
        top: 112px;
    }
    .eyebrow {
        font:
            500 15px system-ui,
            sans-serif;
        letter-spacing: 0.42em;
        color: #b9acff;
        text-transform: uppercase;
    }
    h1 {
        margin: 14px 0 0;
        font-size: 104px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        background: linear-gradient(90deg, #fff 10%, #d8ceff 55%, #ffd9a0 100%);
        -webkit-background-clip: text;
        color: transparent;
    }
    .tag {
        margin-top: 22px;
        font-size: 34px;
        font-style: italic;
        color: #e8e2ff;
    }
    .pills {
        margin-top: 34px;
        display: flex;
        gap: 12px;
        font:
            15px system-ui,
            sans-serif;
    }
    .pills span {
        padding: 9px 18px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #ddd6ff;
    }
    .lull {
        position: absolute;
        right: 70px;
        top: 30px;
        width: 460px;
        height: 460px;
    }
</style>
<div class="sky"></div>
<svg class="stars" id="stars" viewBox="0 0 1280 520"></svg>
<div class="copy">
    <div class="eyebrow">Breathe · Drop · Rewire</div>
    <h1>Self-Hypnosis</h1>
    <div class="tag">A quiet room you carry in your pocket.</div>
    <div class="pills">
        <span>10 guided sessions</span><span>7 techniques</span><span>100% offline</span
        ><span>zero tracking</span>
    </div>
</div>
<svg class="lull" viewBox="-6 6 212 212">
    <defs>
        <radialGradient id="glow" cx="50%" cy="55%" r="50%">
            <stop offset="0" stop-color="#ffd98a" stop-opacity=".6" />
            <stop offset="1" stop-color="#ffd98a" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="face" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#fff6dc" />
            <stop offset=".7" stop-color="#ffe3a1" />
            <stop offset="1" stop-color="#f6c470" />
        </radialGradient>
        <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8f80ff" />
            <stop offset="1" stop-color="#4b3bb0" />
        </linearGradient>
    </defs>
    <g fill="none" stroke="#a99bff" stroke-width="1.2">
        <circle cx="100" cy="112" r="70" opacity=".5" />
        <circle cx="100" cy="112" r="82" opacity=".34" />
        <circle cx="100" cy="112" r="94" opacity=".2" />
        <circle cx="100" cy="112" r="106" opacity=".12" />
    </g>
    <circle cx="100" cy="112" r="84" fill="url(#glow)" />
    <circle cx="100" cy="112" r="56" fill="url(#face)" />
    <g fill="#f0b95f" opacity=".45">
        <circle cx="128" cy="136" r="7" />
        <circle cx="76" cy="144" r="4.5" />
        <circle cx="136" cy="104" r="3.5" />
    </g>
    <path
        d="M50 92 C58 52 98 30 140 38 C168 44 176 62 168 70 C150 62 126 66 112 80 C96 96 70 100 50 92 Z"
        fill="url(#cap)"
    />
    <path
        d="M46 90 C70 104 102 100 118 84 C130 72 150 66 170 72"
        fill="none"
        stroke="#efe9ff"
        stroke-width="9"
        stroke-linecap="round"
    />
    <circle cx="172" cy="66" r="9" fill="#ffd98a" />
    <g fill="#ff9aa8" opacity=".5">
        <ellipse cx="76" cy="124" rx="8" ry="5" />
        <ellipse cx="124" cy="124" rx="8" ry="5" />
    </g>
    <g fill="none" stroke="#4a3a2a" stroke-width="3.2" stroke-linecap="round">
        <path d="M73 112 Q82 121 91 112" />
        <path d="M109 112 Q118 121 127 112" />
        <path d="M92 131 Q100 137 108 131" />
    </g>
    <g fill="#cfc6ff" font-family="Georgia,serif" font-style="italic" font-weight="700">
        <text x="150" y="56" font-size="22">z</text>
        <text x="170" y="38" font-size="16" opacity=".8">z</text>
    </g>
</svg>
<script>
    const r = s => {
        const x = Math.sin(s * 127.1) * 43758.5453;
        return x - Math.floor(x);
    };
    document.getElementById('stars').innerHTML = Array.from(
        { length: 90 },
        (_, i) =>
            `<circle cx="${r(i + 1) * 1280}" cy="${r(i + 101) * 520}" r="${0.6 + r(i + 201) * 1.6}" fill="#fff" opacity="${0.25 + r(i + 301) * 0.65}"/>`
    ).join('');
</script>
